<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BugBounty Recon Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-body: #050608;
            --bg-card: #0b0c10;
            --bg-sidebar: #07080b;
            --border-color: #161822;
            --border-hover: #262938;

            --primary-accent: #8b5cf6;
            --primary-hover: #7c3aed;
            --cyan-accent: #06b6d4;

            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            --text-subtle: #9ca3af;

            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;

            /* ProjectDiscovery background ambient glow */
            background-image:
                radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 20% 80%, rgba(236, 72, 153, 0.05) 0%, transparent 45%);
        }

        /* ProjectDiscovery top gradient bar */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ec4899 0%, #f97316 40%, #8b5cf6 100%);
            z-index: 9999;
        }

        .login-wrapper {
            width: 100%;
            max-width: 410px;
            padding: 24px 20px;
            z-index: 10;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            margin-bottom: 16px;
            color: var(--cyan-accent);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .brand-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .brand-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Main card */
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px 28px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s ease;
        }

        .login-card:hover {
            border-color: var(--border-hover);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            background-color: #08090d;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.875rem;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
            background-color: #040507;
        }

        .btn-primary {
            width: 100%;
            padding: 11px 16px;
            background-color: var(--primary-accent);
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        /* Error alert homogenized with settings/dashboard */
        .error-alert {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.84rem;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            line-height: 1.4;
        }
    </style>
    <link rel="icon" href="/static/favicon.png" type="image/png">
</head>

<body>

    <div class="login-wrapper">
        <div class="brand-header">
            <div class="brand-logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
            </div>
            <h1>Bugbounty_reconV</h1>
            <p>Enter your admin credentials to access the platform</p>
        </div>

        <div class="login-card">
            {% if error %}
            <div class="error-alert">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username"
                        placeholder="admin">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        placeholder="••••••••••••">
                </div>

                <button type="submit" class="btn-primary">
                    <span>Log In</span>
                </button>
            </form>
        </div>
    </div>

</body>

</html>
